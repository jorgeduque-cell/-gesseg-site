faq:
  - question: ¿La asesoría con GESSEG tiene costo?
    answer: '**No.** La reunión incluye un diagnóstico inicial y es completamente gratuita, para que conozcas exactamente qué necesita tu empresa.'
  - question: ¿Cuánto cuesta implementar el SG-SST?
    answer: 'El valor depende de las características de tu empresa: número de trabajadores, nivel de riesgo, sector, entre otros. **En GESSEG te damos un diagnóstico claro y una propuesta ajustada a tu necesidad.**'
  - question: ¿Mi ARL no debería encargarse del SG-SST?
    answer: '**No.** La ARL brinda acompañamiento, pero no implementa el sistema por completo. Nosotros te ayudamos a gestionar ese apoyo de acuerdo a los aportes que realiza tu empresa, para que realmente obtengas beneficios.'
  - question: ¿El SG-SST me sirve para licitaciones o contratos?
    answer: '**Sí.** Muchas empresas exigen el cumplimiento del SG-SST como requisito para contratar o participar en procesos comerciales.'
