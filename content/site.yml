  hero_title: Hablemos sobre el *SG-SST* de su organización.
  hero_lede: Cuéntenos brevemente su situación actual y agendamos una conversación inicial sin costo. Si su empresa requiere acción urgente, escríbanos directamente al WhatsApp.
  info_eyebrow: Datos de contacto
  info_phone_title: Llámenos
  info_phone_hint: Atención lunes a viernes, 8:00 a.m. – 6:00 p.m.
  info_email_title: Escríbanos
  info_email_hint: Respondemos en menos de 24 horas hábiles.
  info_whatsapp_title: WhatsApp Business
  info_whatsapp_hint: Para consultas rápidas y agendamiento inmediato.
  info_office_title: Oficina principal
  info_office_hint: Atención presencial con cita previa.
  info_coverage_title: Cobertura
  info_coverage_text: Todo el territorio nacional
  info_coverage_hint: Bogotá, Medellín, Cali, Barranquilla, Cartagena, Bucaramanga y resto del país.
  form_eyebrow: Solicitud de diagnóstico
  form_title: Cuéntenos su necesidad.
  form_intro: Complete el formulario y un asesor lo contactará en menos de 24 horas hábiles.
  form_submit: Enviar por WhatsApp
  form_disclaimer: Su solicitud se abrirá en WhatsApp para enviarse a nuestro asesor. Al enviar acepta nuestra política de tratamiento de datos (Ley 1581 de 2012).
  faq_title: Antes de *escribirnos*.
  faqs:
    - question: ¿El diagnóstico inicial tiene costo?
      answer: No. La primera reunión de diagnóstico, ya sea presencial en Bogotá o virtual, es sin costo. Allí evaluamos su situación actual y definimos si nuestros servicios encajan con lo que necesita.
    - question: ¿Atienden empresas pequeñas (menos de 10 trabajadores)?
      answer: Sí. La Resolución 0312 de 2019 define estándares diferenciados para empresas de hasta 10, de 11 a 50 y de más de 50 trabajadores. Tenemos paquetes ajustados a cada tamaño.
    - question: ¿Trabajan fuera de Bogotá?
      answer: Sí. Atendemos proyectos en todo el territorio nacional, con presencia en sitio cuando el alcance lo requiere y modalidad híbrida para los componentes documentales.
    - question: ¿Qué documentos necesitan para empezar?
      answer: Para el diagnóstico inicial nos basta con la información básica de la empresa, número de trabajadores y actividad económica. Si ya cuenta con un SG-SST documentado, su revisión nos permite hacer una evaluación más precisa.
