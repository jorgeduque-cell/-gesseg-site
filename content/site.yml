nosotros_page:
  hero_title: Una firma *colombiana*, construida sobre evidencia y disciplina técnica.
  hero_lede: Llevamos más de una década acompañando a empresas en el diseño, implementación y mejora continua de sus Sistemas de Gestión de Seguridad y Salud en el Trabajo.
  quienes_eyebrow: Quiénes somos
  quienes_title: Convertimos la *norma* en una práctica diaria, medible y sostenible.
  quienes_intro: GESSEG Colombia S.A.S es una consultora especializada en Seguridad y Salud en el Trabajo. Nuestro equipo está conformado por profesionales licenciados en SST, ingenieros, médicos y psicólogos con experiencia operativa en sectores de alto riesgo.
  quienes_outro: 'Trabajamos con un principio innegociable: cada documento, cada inspección y cada capacitación debe traducirse en una decisión que reduzca el riesgo real al que está expuesto un trabajador. La gestión documental es un medio, no un fin.'
  valores_eyebrow: Lo que nos define
  valores_title: Cuatro *principios* que guían cada proyecto.
  valores:
    - num: '01'
      title: Rigor técnico
      description: Cada documento que firmamos es defendible ante auditoría, ARL o Ministerio de Trabajo. Citamos norma, evidencia y metodología.
    - num: '02'
      title: Verdad operativa
      description: El riesgo se evalúa en piso, no en escritorio. Nuestros profesionales están en campo con el equipo del cliente, observando la operación real.
    - num: '03'
      title: Acompañamiento sostenido
      description: Un SG-SST sin mantenimiento muere en 6 meses. Construimos planes de seguimiento que viven en la rutina mensual de la organización.
    - num: '04'
      title: Transparencia con el cliente
      description: Si un hallazgo es crítico, lo decimos sin matices. Si una norma cambia, advertimos antes de que el riesgo de incumplimiento sea suyo.
  callout_text: Una empresa madura en SST no es la que tiene los documentos al día. Es la que los tiene al día porque los usa.
  callout_attribution: Filosofía GESSEG
  cta_title: Conozca cómo podemos *aportar* a su organización.
  cta_primary: Agendar reunión
  cta_secondary: Ver servicios
