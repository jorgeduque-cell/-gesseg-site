name: Trigger Vercel Deploy

# Cada push a main dispara un deploy en Vercel vía Deploy Hook.
# Esto resuelve el problema de Vercel saltándose deploys de commits
# hechos desde el CMS (Sveltia).

on:
  push:
    branches: [main]

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Vercel Deploy Hook
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "⚠️  Secret VERCEL_DEPLOY_HOOK no está configurado."
            echo "Configurar en: Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: VERCEL_DEPLOY_HOOK"
            echo "Value: la URL del Deploy Hook desde Vercel"
            exit 0
          fi
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "✓ Deploy disparado en Vercel"
