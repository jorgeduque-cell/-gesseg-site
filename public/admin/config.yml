# =====================================================
# PANEL DE ADMINISTRACIÓN GESSEG · Sveltia CMS
# Edita el contenido del sitio sin tocar código.
# =====================================================

backend:
  name: github
  repo: jorgeduque-cell/-gesseg-site
  branch: main
  base_url: https://gessegcolombia.com
  auth_endpoint: api/auth
  commit_messages:
    create: "Crear {{collection}} desde panel"
    update: "Actualizar {{collection}} desde panel"
    delete: "Eliminar {{collection}} desde panel"
    uploadMedia: "Subir imagen {{path}} desde panel"
    deleteMedia: "Eliminar imagen {{path}} desde panel"

site_url: https://gessegcolombia.com
display_url: https://gessegcolombia.com
locale: es
logo_url: /logo-mark-light.png

media_folder: "public"
public_folder: "/"

publish_mode: simple

collections:
  - name: contenido
    label: "Contenido del sitio"
    description: "Edita aquí todos los textos, precios e imágenes."
    delete: false
    files:
      - name: home
        label: "Todo el contenido"
        file: "content/site.yml"
        format: yaml

        fields:

          # ============= PORTADA =============
          - name: hero
            label: "🏠 Portada principal"
            widget: object
            collapsed: false
            summary: "Portada"
            fields:
              - name: title
                label: "Título grande"
                widget: string
                hint: "💡 Use *palabra* (con asteriscos) para destacar una palabra en cursiva dorada. Ej: Protegemos la *vida* de quienes *sostienen* su empresa."
              - name: lede
                label: "Descripción debajo del título"
                widget: text
                hint: "Texto explicativo corto. Sin formato especial."

          # ============= SERVICIOS DESTACADOS =============
          - name: featured_services
            label: "💼 Servicios destacados (3)"
            widget: list
            min: 3
            max: 3
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - name: id
                label: "ID (no modificar)"
                widget: hidden
              - name: title
                label: "Nombre del servicio"
                widget: string
              - name: badge
                label: "Etiqueta superior"
                widget: string
                hint: "Ej: 01 · Más solicitado"
              - name: description
                label: "Descripción corta"
                widget: text
              - name: points
                label: "Puntos clave"
                widget: list
                field:
                  name: point
                  label: "Punto"
                  widget: string
                hint: "Recomendado: 4 puntos."
              - name: photo
                label: "Foto del servicio"
                widget: image
                hint: "📸 Arrastra una imagen o haz click. Se mostrará en blanco y negro."
              - name: photo_alt
                label: "Descripción de la foto"
                widget: string

          # ============= PLANES Y PRECIOS =============
          - name: plans
            label: "💰 Planes y precios"
            widget: object
            collapsed: false
            summary: "Planes SG-SST + Vial"
            fields:
              - name: promo_label
                label: "Banner promocional"
                widget: string
                hint: "Ej: 50% OFF · primeros 2 meses"

              - name: tiers
                label: "3 Planes SG-SST"
                widget: list
                min: 3
                max: 3
                collapsed: true
                summary: "{{fields.name}} — ${{fields.discount_price}}"
                fields:
                  - name: id
                    label: "ID (no modificar)"
                    widget: hidden
                  - name: name
                    label: "Nombre"
                    widget: string
                    hint: "Ej: Plan I"
                  - name: label
                    label: "Etiqueta superior"
                    widget: string
                    hint: "Ej: Estructura empresarial I"
                  - name: subtitle
                    label: "¿Para cuántos trabajadores?"
                    widget: string
                    hint: "Ej: 10 o menos trabajadores."
                  - name: original_price
                    label: "Precio original"
                    widget: string
                    hint: "Sin símbolo $. Ej: 850.000"
                  - name: discount_price
                    label: "Precio con descuento"
                    widget: string
                    hint: "Sin símbolo $. Ej: 425.000"
                  - name: badge
                    label: "Badge de descuento"
                    widget: string
                    hint: "Ej: 50% OFF"
                  - name: featured
                    label: "¿Destacar este plan?"
                    widget: boolean
                    default: false
                    hint: "Si marcas SÍ, este plan se muestra en azul navy resaltado en el centro."

              - name: features
                label: "Beneficios incluidos en todos los planes"
                widget: list
                field:
                  name: feature
                  label: "Beneficio"
                  widget: string

              - name: vial_title
                label: "Título del Plan Vial"
                widget: string

              - name: vial_description
                label: "Descripción del Plan Vial"
                widget: text

              - name: vial_levels
                label: "3 niveles del Plan Vial"
                widget: list
                min: 3
                max: 3
                collapsed: true
                summary: "{{fields.name}} {{fields.increment}}"
                fields:
                  - name: name
                    label: "Nivel"
                    widget: string
                    hint: "Ej: Básico"
                  - name: increment
                    label: "Incremento"
                    widget: string
                    hint: "Ej: +25%"

              - name: disclaimer
                label: "Texto pequeño de aclaración"
                widget: text
                hint: "Aparece debajo de los planes en letra pequeña."

          # ============= PREGUNTAS FRECUENTES =============
          - name: faq
            label: "❓ Preguntas frecuentes"
            widget: list
            collapsed: true
            summary: "{{fields.question}}"
            fields:
              - name: question
                label: "Pregunta"
                widget: string
              - name: answer
                label: "Respuesta"
                widget: text
                hint: "💡 Use **palabra** (doble asterisco) para destacar en negrita. Ej: **Sí.** Muchas empresas..."

          # ============= CONTACTO =============
          - name: contact
            label: "📞 Datos de contacto"
            widget: object
            collapsed: false
            summary: "Contacto"
            fields:
              - name: phone
                label: "Teléfono"
                widget: string
                hint: "Ej: +57 304 390 0623"
              - name: phone_url
                label: "Link teléfono (para click-to-call)"
                widget: string
                hint: "Ej: tel:+573043900623 (sin espacios)"
              - name: whatsapp
                label: "WhatsApp"
                widget: string
                hint: "Solo dígitos, prefijo país. Ej: 573043900623"
              - name: email
                label: "Correo electrónico"
                widget: string
              - name: city
                label: "Ciudad"
                widget: string
              - name: hours
                label: "Horario de atención"
                widget: string

          # ============= REDES SOCIALES =============
          - name: social
            label: "🌐 Redes sociales"
            widget: object
            collapsed: false
            summary: "Redes"
            fields:
              - name: instagram
                label: "URL Instagram"
                widget: string
              - name: facebook
                label: "URL Facebook"
                widget: string
